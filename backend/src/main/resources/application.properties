spring.application.name=vaultexam
server.port=8080

# --- Uploads ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Local LLMs on CPU can be slow: allow long responses ---
spring.http.clients.read-timeout=10m

# --- PostgreSQL + PGVector ---
spring.datasource.url=jdbc:postgresql://localhost:5433/testingpipeline
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- Ollama --
spring.ai.ollama.chat.options.model=qwen3.5:4b
spring.ai.ollama.chat.options.num-ctx=8192
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.chat.think=false
# NOTE: thinking is switched off in code (VaultExamApplication) because
# the 'think' option is not a plain boolean and can't be bound from properties.

# --- PGVector ---
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
